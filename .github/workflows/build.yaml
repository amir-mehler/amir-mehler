name: Rebuild profile card

on:
  push:
    branches: [main]
    paths-ignore:
      - "dark_mode.svg"
      - "light_mode.svg"
      - "cache/**"
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-card
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: profile/requirements.txt

      - run: pip install -r profile/requirements.txt

      # ACCESS_TOKEN should be a PAT with read:user + repo, so private work counts
      # toward the contribution total. Without it the run still succeeds on
      # GITHUB_TOKEN, but only public activity shows up.
      - name: Render the SVGs
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          USER_NAME: ${{ github.repository_owner }}
        run: python profile/build.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg cache
          git diff --cached --quiet && echo "card unchanged" && exit 0
          git commit -m "chore: refresh profile card"
          git push
